services:
  # Web API and static frontend service
  - type: web
    name: teamsync-platform
    env: docker
    plan: starter
    startCommand: sh -c "alembic upgrade head && python run.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teamsync-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: teamsync-redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 10000

# PostgreSQL database
databases:
  - name: teamsync-db
    databaseName: teamsync
    user: teamsync
    plan: starter

# Redis instance for websockets coordination and presence
redis:
  - name: teamsync-redis
    plan: starter
    ipAllowList: [] # internal connections only
